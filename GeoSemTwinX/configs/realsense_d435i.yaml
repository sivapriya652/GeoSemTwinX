# Live robot / handheld Intel RealSense D435i (start: ros2 launch realsense2_camera rs_launch.py align_depth.enable:=true)
# Topic names below match realsense-ros 4.x; check yours with `ros2 topic list`.
geosemtwinx:
  ros__parameters:
    rgb_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    init_mode: mount                 # camera mounted on the robot, looking forward
    camera_height: 0.45              # metres above the floor  <-- measure on your robot
    camera_pitch_deg: 10.0           # tilted down
    classes: [forklift, pallet, cardboard box, pallet truck, shelf, ladder, fire extinguisher]
    floor_classes: [forklift, pallet truck, ladder]
    detect_every: 3
    depth_max: 5.0
    map_voxel: 0.03
    map_sigma_max: 0.05
    image_scale: 0.5                 # process at 424x240 for speed
    process_all: false               # live: always process the newest frame
    nbv_every_s: 4.0
    dashboard_every_s: 60.0
    output_dir: results/ros_live
